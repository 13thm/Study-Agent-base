# Demo 03-5 · Nginx 反向代理配置（教学重点全部有注释）
#
# 演示四件事：
#   ① upstream 负载均衡（两个 FastAPI 实例，验证轮询）
#   ② SSE 穿透（proxy_buffering off —— 99% 的人上线后卡在这）
#   ③ 限流（limit_req_zone + burst）
#   ④ 大文件上传（client_max_body_size）

# ── 限流区：按客户端 IP，10 req/s，共享内存 10MB ──
# 📌 生产要按 API Key / 用户 ID 限流，否则一个 NAT 后面所有人共享一个桶。
#    做法：用 map 从 Authorization 头提取 key 作为 zone 的 key（阶段 5 模块 01 有完整写法）
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# ── 日志格式：带上 request_id 与上游耗时，排障必备 ──
log_format trace '$remote_addr [$time_local] "$request" $status '
                 'rt=$request_time urt=$upstream_response_time '
                 'up=$upstream_addr rid=$request_id';

upstream api_pool {
    server api1:8000 max_fails=2 fail_timeout=10s;   # 被动健康检查
    server api2:8000 max_fails=2 fail_timeout=10s;
    keepalive 32;                                    # 复用到上游的长连接
    # 其他策略：least_conn; / ip_hash; / hash $request_id consistent;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 50m;        # ★ 默认 1m，上传 PDF 会 413
    server_tokens off;               # 不暴露 nginx 版本
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    access_log /var/log/nginx/access.log trace;

    # ── 普通 API ──
    location /api/ {
        limit_req zone=api_per_ip burst=20 nodelay;   # 突发允许 20 个排队，不延迟处理
        limit_conn conn_per_ip 20;

        proxy_pass http://api_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";              # 配合 upstream keepalive
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # ★ 不传则应用只能看到 nginx 的 IP，限流全失效
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;   # ★ 与应用的 request_id 打通
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
    }

    # ── SSE 专用 location（★ 本文件最重要的 6 行）──
    location ~ ^/api/chat/stream$ {
        proxy_pass http://api_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;

        proxy_buffering off;             # ★★ 关掉缓冲，否则流式变一次性返回
        proxy_cache off;                 # ★  不缓存
        gzip off;                        # ★  压缩需要缓冲，必须关
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;        # ★  长连接别被 60s 默认值掐断
        add_header X-Accel-Buffering no; # ★  应用侧也可以发这个头达到同样效果
    }

    # ── WebSocket（需要 Upgrade 头）──
    location /ws/ {
        proxy_pass http://api_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;      # ★ 缺了握手直接失败
        proxy_set_header Connection "upgrade";       # ★
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://api_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }
}
