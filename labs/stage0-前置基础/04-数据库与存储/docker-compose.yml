# 模块 04 的依赖服务（可选）—— 不起它们也能跑全部 Demo（会自动降级到 SQLite/fakeredis/本地存储）
# 起：docker compose up -d      停：docker compose down       清空数据：docker compose down -v
services:
  postgres:
    image: pgvector/pgvector:pg16          # 自带 vector 扩展，一个镜像搞定业务库+向量库
    environment:
      POSTGRES_PASSWORD: pw
      POSTGRES_DB: agent
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: pw
      MYSQL_DATABASE: agent
    ports: ["3306:3306"]
    volumes: ["mysqldata:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppw"]
      interval: 5s
      timeout: 3s
      retries: 20
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes      # AOF 持久化，重启不丢会话
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    ports: ["9000:9000", "9001:9001"]           # 9001 是 Web 控制台
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  mysqldata:
  redisdata:
  miniodata:
